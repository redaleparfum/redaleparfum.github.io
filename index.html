 $("#chips").innerHTML=types.map(t=>`<button class="chip ${t==filt?'on':''}" data-f="${esc(t)}">${esc(L(t))}</button>`).join("");
 $("#grid").innerHTML=P.map((x,i)=>({x,i})).filter(o=>filt=="Tous"||o.x.t==filt).map(({x,i})=>`<article class="card ${i==sel?'sel':''}">

function renderCart(){

 const h=Object.keys(cart).map(id=>{const x=P.find(y=>y.id==id);if(!x){if(P.length)delete cart[id];return ""}const q=cart[id];t+=x.p*q;c+=q;
  return `<div class="it"><div><b>${esc(x.n)}</b><br><small>${fmt(x.p)}</small></div><div class="qty"><button data-m="${id}" aria-label="Moins">−</button> ${q} <button data-p="${id}" aria-label="Plus">+</button></div></div>`}).join("");
 $("#items").innerHTML=h||"<p style='color:var(--mute)'>"+tr("cartEmpty")+"</p>";
 $("#total").textContent=fmt(t);$("#cnt").textContent=c;
 const lines=Object.keys(cart).map(id=>{const x=P.find(y=>y.id==id);return `- ${cart[id]} x ${x.n} (${fmt(x.p*cart[id])})`});
 $("#wa").href=`https://wa.me/${PHONE}?text=`+encodeURIComponent(tr("wa1")+"\n"+lines.join("\n")+"\n"+tr("tot")+" : "+fmt(t));
 $("#wa").style.display=c?"block":"none";
}

function readImg(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.72))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(file)})}
function upVideo(f){return new Promise((ok,no)=>{const r=firebase.storage().ref("videos/"+Date.now()+"_"+f.name.replace(/[^\w.-]/g,"_"));const t=r.put(f);t.on("state_changed",s=>{$("#fAdd").textContent=Math.round(s.bytesTransferred/s.totalBytes*100)+" %"},no,()=>{$("#fAdd").textContent="Ajouter à la boutique";r.getDownloadURL().then(ok,no)})})}

 const LOGO_URL="https://i.imgur.com/E0K0bD8.jpeg";
 // La photo du parfum tourne en 3D (plaque avec bords dorés). Si elle ne charge pas, le flacon 3D reste affiché.
 const tl=new THREE.TextureLoader();tl.setCrossOrigin("anonymous");
 tl.load(LOGO_URL,tex=>{
  const a=tex.image.width/tex.image.height,h=4.4,w=Math.min(h*a,4);
  const edge=new THREE.MeshStandardMaterial({color:0xd9a441,metalness:1,roughness:.25});
  const face=new THREE.MeshBasicMaterial({map:tex});
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,w/a>h?h:w/a,.14),[edge,edge,edge,edge,face,face]);
  const P2=new THREE.Group();P2.add(m);G.add(P2);
  G.children.forEach(o=>{if(o!==P2)o.visible=false});
 },undefined,()=>console.warn("Image non chargée : flacon 3D affiché"));
 // bulles
 const bm=new THREE.MeshPhysicalMaterial({color:0xffffff,transparent:true,opacity:.28,roughness:0});
 [[-.5,.5,.2,.2],[.5,-.7,.2,.28],[.1,.9,-.1,.14],[-.6,-.9,.1,.18]].forEach(b=>add(new THREE.SphereGeometry(b[3],20,20),bm,b[0],b[1],b[2]));

 function size(){const w=box.clientWidth,h=box.clientHeight;R.setSize(w,h);C.aspect=w/h;C.updateProjectionMatrix()}
 function size(){const w=box.clientWidth,h=box.clientHeight;if(!w||!h)return;R.setSize(w,h);C.aspect=w/h;C.position.z=9+Math.max(0,1.1-w/h)*7;C.updateProjectionMatrix()}
 if(window.ResizeObserver)new ResizeObserver(size).observe(box);else addEventListener("resize",size);size();

 let rot=.4,vel=.004,drag=false,lx=0;
 const down=e=>{drag=true;lx=e.clientX;box.style.cursor="grabbing";$("#hint").style.opacity=0};
 const up=()=>{drag=false;box.style.cursor="grab"};
 const move=e=>{if(!drag)return;const d=e.clientX-lx;lx=e.clientX;rot+=d*.01;vel=d*.0006};
 box.addEventListener("pointerdown",down);addEventListener("pointerup",up);addEventListener("pointermove",move);
 const calm=matchMedia("(prefers-reduced-motion:reduce)").matches;
 let vis=true;new IntersectionObserver(e=>vis=e[0].isIntersecting).observe(box);
 (function loop(t){
  requestAnimationFrame(loop);if(!vis)return;
  if(!drag){rot+=vel;vel+=((calm?0:.004)-vel)*.02}
  G.rotation.y=rot;G.position.y=Math.sin(t*.0012)*.08;
  sp.rotation.y=t*.00005;
  R.render(S,C);
 })(0);
