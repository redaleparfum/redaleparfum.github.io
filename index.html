function readImg(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.72))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(file)})}
function upCloud(f,btn){return new Promise((ok,no)=>{
 const x=new XMLHttpRequest(),fd=new FormData(),b=$(btn),old=b.textContent;
 fd.append("file",f);fd.append("upload_preset",CLOUDINARY.preset);
 x.open("POST","https://api.cloudinary.com/v1_1/"+encodeURIComponent(CLOUDINARY.cloud)+"/video/upload");
 x.upload.onprogress=e=>{if(e.lengthComputable)b.textContent=Math.round(e.loaded/e.total*100)+" %"};
 x.onload=()=>{b.textContent=old;try{const j=JSON.parse(x.responseText);if(j.secure_url)ok({url:j.secure_url.replace("/upload/","/upload/q_auto,f_mp4/").replace(/\.\w+$/,".mp4"),path:""});else no(new Error((j.error&&j.error.message)||"upload"))}catch(e){no(e)}};
 x.onerror=()=>{b.textContent=old;no(new Error("network"))};
 x.send(fd)})}
function upMedia(f,dir,btn){if(CLOUDINARY.cloud&&CLOUDINARY.preset)return upCloud(f,btn);return new Promise((ok,no)=>{
 const st=firebase.storage();try{st.setMaxUploadRetryTime(15000);st.setMaxOperationRetryTime(15000)}catch(e){}
 const path=dir+"/"+Date.now()+"_"+f.name.replace(/[^\w.-]/g,"_"),r=st.ref(path),t=r.put(f),b=$(btn),old=b.textContent;let moved=0;
 const to=setTimeout(()=>{if(!moved)t.cancel()},20000);
 t.on("state_changed",x=>{if(x.bytesTransferred>0)moved=1;b.textContent=Math.round(x.bytesTransferred/x.totalBytes*100)+" %"},e=>{clearTimeout(to);b.textContent=old;no(e)},()=>{clearTimeout(to);b.textContent=old;r.getDownloadURL().then(u=>ok({url:u,path}),no)})})}

/* ---------- 3D ---------- */
let liquidMat,setColor=()=>{};
(function(){
 const box=$("#stage");
 let dead=false;
 const fallback=()=>{if(dead)return;dead=true;const u=P[0]&&P[0].img;box.innerHTML=u?'<img alt="Réda Le Parfum" style="width:100%;height:100%;object-fit:contain" src="'+esc(thumb(u,"l"))+'">':'<p style="padding:40px;text-align:center;font:700 30px Cormorant Garamond,serif;color:var(--gold)">RÉDA LE PARFUM</p>';
  window.set3D=u=>{const i=box.querySelector("img");if(i&&u)i.src=thumb(u,"l")}};
 try{
  if(!window.THREE||/[?&]no3d/.test(location.search)||(navigator.deviceMemory&&navigator.deviceMemory<=2)){fallback();return}
  const coarse=matchMedia("(pointer:coarse)").matches;
  const R=new THREE.WebGLRenderer({antialias:!coarse,alpha:true,powerPreference:"low-power"});
  R.setPixelRatio(Math.min(devicePixelRatio,coarse?1.5:2));
  R.domElement.addEventListener("webglcontextlost",e=>{e.preventDefault();fallback()});
  box.prepend(R.domElement);
  const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(32,1,.1,50);C.position.set(0,.4,9);
  S.add(new THREE.AmbientLight(0xffffff,.8));
  const k=new THREE.DirectionalLight(0xfff0d0,1.2);k.position.set(4,5,6);S.add(k);
  const G=new THREE.Group();S.add(G);
  const std=(o)=>new THREE.MeshStandardMaterial(o);
  const gold=std({color:0xd9a441,metalness:.8,roughness:.3});
  const glass=std({color:0xffffff,transparent:true,opacity:.2,roughness:.1,depthWrite:false});
  liquidMat=std({color:(P[0]&&P[0].c)||"#c9831d",transparent:true,opacity:.9,roughness:.25});
  const add=(g,m,x,y,z)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);G.add(o);return o};
  add(new THREE.BoxGeometry(2.4,3,1.1),liquidMat,0,-.1,0).scale.set(.9,.86,.86);
  add(new THREE.BoxGeometry(2.4,3,1.1),glass,0,-.1,0);
  add(new THREE.BoxGeometry(2.4,.28,1.1),std({color:0xffffff,transparent:true,opacity:.35,roughness:.1}),0,-1.5,0);
  add(new THREE.CylinderGeometry(.5,.55,.35,24),gold,0,1.55,0);
  add(new THREE.CylinderGeometry(.5,.5,.25,24),std({color:0xb98a2e,metalness:.8,roughness:.5}),0,1.8,0);
  add(new THREE.BoxGeometry(1.15,.85,.75),std({color:0x0b0b0b,metalness:.3,roughness:.3}),0,2.35,0).rotation.y=.2;
  const bm=std({color:0xffffff,transparent:true,opacity:.28,roughness:.1});
  [[-.5,.5,.2,.2],[.5,-.7,.2,.28],[.1,.9,-.1,.14],[-.6,-.9,.1,.18]].forEach(b=>add(new THREE.SphereGeometry(b[3],12,12),bm,b[0],b[1],b[2]));
  const n=80,pos=new Float32Array(n*3);
  for(let i=0;i<n;i++)pos.set([(Math.random()-.5)*10,(Math.random()-.5)*7,(Math.random()-.5)*5-1],i*3);
  const pg=new THREE.BufferGeometry();pg.setAttribute("position",new THREE.BufferAttribute(pos,3));
  const sp=new THREE.Points(pg,new THREE.PointsMaterial({color:0xf2cf80,size:.06,transparent:true,opacity:.8}));S.add(sp);
  setColor=c=>liquidMat.color.set(c);
  // La photo du parfum choisi tourne en 3D (réduite à 1024 px pour ménager la mémoire du téléphone)
  let plate=null;
  function loadPlate(url){
   if(!url){if(plate){G.remove(plate);plate=null}G.children.forEach(o=>o.visible=true);return}
   const im=new Image();im.crossOrigin="anonymous";
   im.onload=()=>{try{
    const q=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(im.width*q));c.height=Math.max(1,Math.round(im.height*q));
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    const tex=new THREE.CanvasTexture(c);tex.minFilter=THREE.LinearFilter;tex.generateMipmaps=false;
    const a=c.width/c.height,w=Math.min(4.4*a,4),edge=std({color:0xd9a441,metalness:.8,roughness:.3}),face=new THREE.MeshBasicMaterial({map:tex});
    if(plate){G.remove(plate);plate.geometry.dispose();plate.material.forEach(m=>{if(m.map)m.map.dispose()})}
    G.children.forEach(o=>o.visible=false);
    plate=new THREE.Mesh(new THREE.BoxGeometry(w,w/a,.14),[edge,edge,edge,edge,face,face]);G.add(plate);
   }catch(e){}};
   im.src=thumb(url,"h");
  }
  window.set3D=loadPlate;loadPlate(P[0]&&P[0].img);
  function size(){const w=box.clientWidth,h=box.clientHeight;if(!w||!h)return;R.setSize(w,h);C.aspect=w/h;C.position.z=9+Math.max(0,1.1-w/h)*7;C.updateProjectionMatrix()}
  if(window.ResizeObserver)new ResizeObserver(size).observe(box);else addEventListener("resize",size);size();
  let rot=.4,vel=.004,drag=false,lx=0,last=0;
  const down=e=>{drag=true;lx=e.clientX;box.style.cursor="grabbing";const h=$("#hint");if(h)h.style.opacity=0};
  const up=()=>{drag=false;box.style.cursor="grab"};
  const move=e=>{if(!drag)return;const d=e.clientX-lx;lx=e.clientX;rot+=d*.01;vel=d*.0006};
  box.addEventListener("pointerdown",down);addEventListener("pointerup",up);addEventListener("pointermove",move);
  const calm=matchMedia("(prefers-reduced-motion:reduce)").matches;
  let vis=true;if(window.IntersectionObserver)new IntersectionObserver(e=>vis=e[0].isIntersecting).observe(box);
  (function loop(t){
   if(dead)return;requestAnimationFrame(loop);
   if(!vis||document.hidden||(coarse&&t-last<33))return;last=t;
   if(!drag){rot+=vel;vel+=((calm?0:.004)-vel)*.02}
   G.rotation.y=rot;G.position.y=Math.sin(t*.0012)*.08;sp.rotation.y=t*.00005;
   R.render(S,C);
  })(0);
 }catch(e){fallback()}
})();


/* ---------- Vidéo vedette (vitrine) ---------- */
const FEATURED_VIDEO="https://i.imgur.com/f9C8S26.mp4";
(function(){
 const sec=$("#showcase"),v=$("#sv"),wrap=sec.querySelector(".vwrap");
 if(!FEATURED_VIDEO){sec.hidden=true;return}
 const calm=matchMedia("(prefers-reduced-motion:reduce)").matches||(navigator.connection&&navigator.connection.saveData);
 let loaded=false,userPaused=false;
 const load=()=>{if(!loaded){loaded=true;v.src=FEATURED_VIDEO;v.preload="metadata"}};
 const sync=()=>{$("#vpp").textContent=v.paused?"▶":"⏸";$("#vmu").textContent=v.muted?"🔇":"🔊"};
 v.addEventListener("loadedmetadata",()=>{if(v.videoWidth&&v.videoHeight)wrap.style.aspectRatio=String(Math.min(2,Math.max(.5,v.videoWidth/v.videoHeight)))});
 v.addEventListener("error",()=>{sec.hidden=true});
 ["play","pause","volumechange"].forEach(ev=>v.addEventListener(ev,sync));
 if("IntersectionObserver" in window){
  new IntersectionObserver(es=>{const e=es[es.length-1];
   if(e.intersectionRatio>0)load();
   if(e.intersectionRatio>=.4&&!calm&&!userPaused)v.play().catch(()=>{});
   if(e.intersectionRatio<.1)v.pause();
  },{threshold:[0,.1,.4]}).observe(sec);
 }else load();
 document.addEventListener("visibilitychange",()=>{if(document.hidden)v.pause()});
 $("#vpp").onclick=()=>{load();if(v.paused){userPaused=false;v.play().catch(()=>{})}else{userPaused=true;v.pause()}};
 $("#vmu").onclick=()=>{load();v.muted=!v.muted;if(!v.muted&&v.paused)v.play().catch(()=>{})};
 $("#vfs").onclick=()=>{load();if(wrap.requestFullscreen)wrap.requestFullscreen().catch(()=>{});else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen()};
 sync();
})();

})();

/* ---------- Assistant chat ---------- */
const CHAT_KW=[
 ["price",/prix|tarif|combien|price|cost|how much|precio|cuanto|cuesta|prezzo|quanto|costa|سعر|اسعار|أسعار|ثمن|بكم|كم/],
 ["order",/command|order|pedido|pedir|comprar|acheter|buy|purchase|ordin|acquist|طلب|شراء|اشتري|أشتري/],
 ["deliv",/livr|deliver|ship|envio|entrega|consegna|spedizion|توصيل|شحن|تسليم/],
 ["pay",/paie|pay|pago|pagar|pagament|دفع|ادفع/],
 ["orig",/original|authent|vrai|faux|fake|europe|europa|genuin|auten|اصلي|أصلي|اوروبا|أوروبا|تقليد|مزيف/],
 ["size",/\bml\b|100|taille|size|contenance|tamano|capacit|dimension|حجم|سعة|مل/],
 ["contact",/telephone|phone|numero|number|call|appel|llam|chiam|whatsapp|wasap|contact|تواصل|هاتف|رقم|اتصال|واتساب/],
 ["men",/homme|\bmen\b|hombre|uomo|رجال|رجالي/],
 ["women",/femme|women|mujer|donna|نساء|نسائي|امرأة/],
 ["prods",/parfum|perfume|profumo|collection|colec|catalog|produit|product|prodott|عطر|عطور|منتج|مجموعة/],
 ["greet",/bonjour|salut|salam|hello|\bhi\b|hola|ciao|buongiorno|مرحبا|السلام|اهلا|أهلا/]
];
const STOP=new Set(["with","pour","for","eau","the","les","des","parfum","you"]);
const normT=t=>t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
let CH=0,chatQs=[];
const TLb=t=>T[lang]["t_"+t]||t;
const plist=a=>a.map(x=>"• "+esc(x.n)+" — "+fmt(+x.p||0)).join("<br>");
function chatMsg(who,html){const d=document.createElement("div");d.className="m "+who;d.innerHTML=html;$("#cmsgs").appendChild(d);$("#cmsgs").scrollTop=1e6}
function chatWa(){$("#cwa").href="https://wa.me/"+PHONE+"?text="+encodeURIComponent(tr("wa2")+"\n"+chatQs.join("\n"))}
function renderQ(){$("#cq").innerHTML=[["price","c_q1"],["orig","c_q2"],["deliv","c_q3"],["order","c_q4"]].map(([k,l])=>`<button class="chip" data-q="${k}">${tr(l)}</button>`).join("")}
function intentAns(k){
 if(k==="price")return P.length?tr("c_price")+"<br>"+plist(P):tr("c_none");
 if(k==="prods")return P.length?tr("c_cat")+"<br>"+plist(P):tr("c_none");
 if(k==="men"||k==="women"){const a=P.filter(x=>x.t===(k==="men"?"Homme":"Femme"));return a.length?tr(k==="men"?"c_men":"c_women")+"<br>"+plist(a):tr("c_none")}
 return tr({order:"c_order",deliv:"c_deliv",pay:"c_pay",orig:"c_orig",size:"c_size",contact:"c_contact",greet:"c_greet"}[k]);
}
function answer(q){
 const t=normT(q);
 const pm=P.find(x=>x.n&&normT(x.n).split(/\s+/).some(w=>w.length>=4&&!STOP.has(w)&&t.includes(w)));
 if(pm)return esc(pm.n)+" — "+esc(TLb(pm.t))+" · 100 ml · "+fmt(+pm.p||0)+(dsc(pm)?"<br>"+esc(dsc(pm)):"")+"<br>"+tr("c_prodEnd");
 for(const [k,re] of CHAT_KW)if(re.test(t))return intentAns(k);
 return tr("c_fb");
}
function chatOpen(){
 $("#chat").classList.add("on");
 if(!CH){CH=1;chatMsg("bot",tr("c_hello"));renderQ();chatWa()}
 setTimeout(()=>$("#cin").focus(),60);
}
function chatSay(q,k){
 chatMsg("me",esc(q));chatQs.push(q);chatWa();
 setTimeout(()=>chatMsg("bot",k?intentAns(k):answer(q)),350);
}
$("#chatBtn").onclick=chatOpen;
$("#cx").onclick=()=>$("#chat").classList.remove("on");
$("#cq").addEventListener("click",e=>{const k=e.target.dataset.q;if(k)chatSay(e.target.textContent,k)});
$("#cform").onsubmit=e=>{e.preventDefault();const v=$("#cin").value.trim();if(!v)return;$("#cin").value="";chatSay(v)};
$("#lang").onchange=e=>setLang(e.target.value);
$("#burger").onclick=()=>$("#mnav").classList.toggle("on");
$("#mnav").onclick=e=>{if(e.target.tagName==="A")$("#mnav").classList.remove("on")};
$("#vm").onclick=e=>{if(e.target.id==="vm"||e.target.id==="vx"){$("#vbox").innerHTML="";$("#vm").classList.remove("on")}};
$("#cf").onsubmit=async e=>{
 e.preventDefault();
 const n=$("#cN").value.trim(),ph=$("#cP").value.trim(),m=$("#cM").value.trim();
 if(!n||ph.replace(/\D/g,"").length<8||!m){toast(tr("req"));return}
 const d={name:n,phone:ph,email:$("#cE").value.trim(),subject:$("#cS").selectedOptions[0].textContent,msg:m,lang,created:Date.now()};
 if(FB){try{await db.collection("messages").add(d)}catch(x){}}
 const txt=tr("wa2")+"\n"+tr("fName")+": "+n+"\n"+tr("fPhone")+": "+ph+"\n"+tr("fSubject")+": "+d.subject+"\n"+m;
 window.open("https://wa.me/"+PHONE+"?text="+encodeURIComponent(txt),"_blank");
 e.target.reset();toast(tr("sent"));
};
setLang(lang);
